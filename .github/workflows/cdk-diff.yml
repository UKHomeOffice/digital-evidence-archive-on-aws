name: CDK Diff Sandbox

on:
  push:
    branches:
      - '**'

permissions:
  id-token: write   # This is required for requesting the JWT
  contents: read    # This is required for actions/checkout

jobs:
  cdk_diff_sandbox:
    env:
      CONFIGNAME: 'sandbox'
      STAGE: 'cfideasandbox'
      DOMAIN_PREFIX: 'cfideasandbox'
    environment: dea-sandbox
    defaults:
      run:
        shell: bash
        working-directory: ./source
    name: CDK Diff DEA Sandbox
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: TruffleHog OSS
        uses: trufflesecurity/trufflehog@v3.95.2
        with:
          extra_args: --only-verified

      - name: Install
        uses: ./.github/actions/baseAction

      - name: Rush Build
        run: |
          node common/scripts/install-run-rush.js build

      - name: configure aws credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME_SANDBOX_HOMS_TEAM }}
          role-session-name: GITHUBACTIONSESSION
          aws-region: ${{ secrets.AWS_REGION }}

      - name: CDK Diff
        run: |
          cd dea-main
          npm run cdk bootstrap aws://${{secrets.AWS_ACCT_NUMBER_SANDBOX}}/${{secrets.AWS_REGION}}
          npm run cdk diff -- --all
